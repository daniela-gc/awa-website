# Backend https://www.netlifycms.org/docs/configuration-options/#backend
backend:
  name: git-gateway
  branch: master

# Set to true to use the CMS locally (with the default proxy server port)
local_backend: true

# Publish mode https://www.netlifycms.org/docs/configuration-options/#publish-mode
# publish_mode: editorial_workflow

# Media and Public Folders https://www.netlifycms.org/docs/configuration-options/#media-and-public-folders
media_folder: 'app/static/images/uploads' # Media files will be stored in the repo under images/uploads
public_folder: '/images/uploads'

# URL to the published site
site_url: https://www.artwhileapart.org

# The CMS UI will include a link in the fixed area at the top of the page with this URL
display_url: https://www.artwhileapart.org

# Brands the CMS with the logo
logo_url: https://imgur.com/2LBZtL8.png

# Collections https://www.netlifycms.org/docs/configuration-options/#collections
collections:
  - name: 'portfolio'
    label: 'Portfolio'
    label_singular: 'Portfolio piece'
    folder: 'app/content/portfolio'
    create: true
    format: 'json'
    fields:
      - { label: 'Piece', name: featuredImage, widget: image }
      - { label: 'Title', name: title, widget: string }
      - { label: 'Social media link', name: socialMediaLink, widget: string }
  - name: 'staff'
    label: 'Staff'
    folder: 'app/content/staff'
    create: true
    format: 'json'
    sort: 'position:asc'
    fields:
      - { label: 'Image', name: featuredImage, widget: image }
      - { label: "Artist's name", name: title, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Bio, name: bio, widget: string }
      - label: 'External Links'
        label_singular: 'external link'
        name: externalLinks
        widget: list
        max: 5
        hint: "FOR E-MAILS: Please add 'mailto:' without the quotes in front of the email adress, so that the link works."
        fields:
          - {
              label: 'Site name (e.g. Instagram, DeviantArt, Website)',
              name: 'name',
              widget: 'string',
            }
          - { label: 'Link', name: 'url', widget: string }
      - label: 'Position in page'
        name: 'position'
        hint: 'Optional number to order the staff member in the Team page.'
        widget: 'number'
        required: false
        value_type: 'int'
        min: 1
        step: 1
  - name: 'artist'
    label: 'Artists'
    label_singular: 'Artist'
    folder: 'app/content/artists'
    create: true
    format: 'json'
    sort: 'position:asc'
    fields:
      - { label: 'Image', name: featuredImage, widget: image }
      - { label: "Artist's name", name: title, widget: string }
      - { label: 'Bio', name: bio, widget: string }
      - label: 'External Links'
        label_singular: 'external link'
        name: externalLinks
        widget: list
        max: 5
        hint: "FOR E-MAILS: Please add 'mailto:' without the quotes in front of the email adress, so that the link works."
        fields:
          - {
              label: 'Site name (e.g. Instagram, DeviantArt, Website)',
              name: 'name',
              widget: 'string',
            }
          - { label: 'Link', name: 'url', widget: 'string' }
      - label: 'Position in page'
        name: 'position'
        hint: 'Optional number to order the artist in the Team page.'
        widget: 'number'
        required: false
        value_type: 'int'
        min: 1
        step: 1
  - name: 'monthlyShowcase'
    label: 'Monthly Showcase'
    files:
      - label: 'OTMs'
        name: 'otms'
        file: 'app/content/monthly_showcase/otms.json'
        fields:
          - label: 'Artist of the month'
            name: 'artistOfTheMonth'
            widget: 'object'
            summary: '{{fields.name}}'
            fields:
              - { label: "Artist's name", name: 'artistName', widget: string }
              - { label: 'Social media link', name: socialMediaLink, widget: string }
              - { label: 'Social media handler', name: socialMediaHandler, widget: string }
              - label: 'Pieces (Max 5)'
                name: pieces
                widget: list
                max: 5
                label_singular: 'piece'
                fields:
                  - { label: 'Image', name: 'featuredImage', widget: 'image' }
          - label: 'Piece of the month'
            name: 'pieceOfTheMonth'
            widget: 'object'
            summary: '{{fields.name}}'
            fields:
              - { label: "Artist's name", name: 'artistName', widget: string }
              - { label: "Pet's name", name: 'petName', widget: 'string' }
              - { label: 'Social media link', name: socialMediaLink, widget: string }
              - { label: 'Social media handler', name: socialMediaHandler, widget: string }
              - { label: 'Piece', name: featuredImage, widget: image }
          - label: "Staff's highlight"
            name: 'staffHighlight'
            widget: 'object'
            summary: '{{fields.name}}'
            fields:
              - { label: "Artist's name", name: 'artistName', widget: string }
              - { label: "Pet's name", name: 'petName', widget: 'string' }
              - { label: 'Social media link', name: socialMediaLink, widget: string }
              - { label: 'Social media handler', name: socialMediaHandler, widget: string }
              - { label: 'Piece', name: featuredImage, widget: image }
          - label: 'Mentor of the month'
            name: 'mentorOfTheMonth'
            widget: 'object'
            summary: '{{fields.name}}'
            fields:
              - { label: "Artist's name", name: 'artistName', widget: string }
              - { label: 'Social media link', name: socialMediaLink, widget: string }
              - { label: 'Social media handler', name: socialMediaHandler, widget: string }
              - { label: 'Piece', name: featuredImage, widget: image }
  - name: 'footerPages'
    label: 'Footer Pages'
    files:
      - label: 'Privacy Policy'
        name: 'privacyPolicy'
        format: json
        file: 'app/content/privacy_policy/privacy_policy.json'
        fields:
          - { label: 'Privacy Policy', name: privacyPolicyText, widget: markdown }
      - label: 'Terms of Service'
        name: 'termsOfService'
        format: json
        file: 'app/content/terms_of_service/terms_of_service.json'
        fields:
          - { label: 'Terms of Service', name: termsOfServiceText, widget: markdown }
      - label: 'House Rules'
        name: 'houseRules'
        format: json
        file: 'app/content/house_rules/house_rules.json'
        fields:
          - { label: 'House Rules', name: houseRulesText, widget: markdown }
