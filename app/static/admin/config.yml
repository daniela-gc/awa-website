# Backend https://www.netlifycms.org/docs/configuration-options/#backend
backend:
  name: git-gateway
  branch: master

# Publish mode https://www.netlifycms.org/docs/configuration-options/#publish-mode
# publish_mode: editorial_workflow

# Media and Public Folders https://www.netlifycms.org/docs/configuration-options/#media-and-public-folders
media_folder: 'app/static/images/uploads' # Media files will be stored in the repo under images/uploads
public_folder: '/images/uploads'

# URL to the published site
site_url: https://silly-bombolone-eb69bf.netlify.app

# The CMS UI will include a link in the fixed area at the top of the page with this URL
display_url: https://silly-bombolone-eb69bf.netlify.app

# Brands the CMS with our logo
logo_url: https://imgur.com/2LBZtL8

# Collections https://www.netlifycms.org/docs/configuration-options/#collections
collections:
  - label: Settings
    name: settings
    files:
      - label: General
        name: general
        format: json
        file: 'app/content/settings/general.json'
        fields:
          - { label: Title, name: title, widget: string }
          - { label: 'Title Template', name: titleTemplate, widget: string }
          - { label: 'Welcome Text', name: welcomeText, widget: markdown }
          - { label: Logo, name: logo, widget: image }
          - { label: Icon, name: icon, widget: image }
          - { label: 'Loading Color', name: loadingColor, widget: string, default: '#000000' }
          - { label: 'SEO Description', name: seoDescription, widget: text, required: false }
          - { label: 'SEO Meta Image', name: seoMetaImage, widget: image, required: false }
      - label: Manifest
        name: manifest
        format: json
        file: 'app/content/settings/manifest.json'
        fields:
          - { label: Name, name: name, widget: string }
          - { label: 'Short name', name: shortName, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: 'Theme color', name: themeColor, widget: string }
          - { label: 'Background color', name: backgroundColor, widget: string }
          - { label: Lang, name: lang, widget: string, default: en }

  - name: 'pages'
    label: 'Pages'
    folder: 'app/content/pages'
    create: true
    slug: '{{slug}}'
    format: 'json'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Subtitle, name: subtitle, widget: text, required: false }
      - { label: Content, name: content, widget: markdown }
      - { label: 'Featured Image', name: featuredImage, widget: image, required: false }
      - { label: 'SEO Description', name: seoDescription, widget: text, required: false }
      - { label: 'SEO Meta Image', name: seoMetaImage, widget: image, required: false }
  - name: 'blog'
    label: 'Blog'
    folder: 'app/content/blog'
    create: true
    slug: '{{slug}}'
    format: 'json'
    sort: 'published_at:desc'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: 'Published At', name: publishedAt, widget: date, format: 'Do MMM YYYY' }
      - { label: Content, name: content, widget: markdown }
      - { label: 'Featured Image', name: featuredImage, widget: image, required: false }
      - { label: 'SEO Description', name: seoDescription, widget: text, required: false }
      - { label: 'SEO Meta Image', name: seoMetaImage, widget: image, required: false }
  - name: 'portfolio'
    label: 'Portfolio'
    folder: 'app/content/portfolio'
    create: true
    format: 'json'
    fields:
      - { label: 'Featured Image', name: featuredImage, widget: image, required: true }
      - { label: Title, name: title, widget: string }
      - { label: 'Social media link', name: socialMediaLink, widget: string }
  - name: 'staff'
    label: 'Staff'
    folder: 'app/content/staff'
    create: true
    format: 'json'
    sort: 'position:asc'
    fields:
      - { label: 'Featured Image', name: featuredImage, widget: image, required: true }
      - { label: Title, name: title, widget: string }
      - { label: Role, name: role, widget: string, required: true }
      - { label: Bio, name: bio, widget: string, required: true }
      - label: 'External Links'
        name: externalLinks
        widget: list
        max: 5
        label_singular: 'external link'
        fields:
          - {
              label: 'Site name (i.e. Instagram, DeviantArt", Website)',
              name: 'name',
              widget: 'string',
            }
          - { label: 'Link / URL', name: 'url', widget: 'string' }
      - label: 'Position in page'
        name: 'position'
        widget: 'number'
        value_type: 'int'
        min: 1
        step: 1
  - name: 'artist'
    label: 'Artist'
    folder: 'app/content/artists'
    create: true
    format: 'json'
    sort: 'position:asc'
    fields:
      - { label: 'Featured Image', name: featuredImage, widget: image, required: true }
      - { label: Title, name: title, widget: string }
      - { label: Bio, name: bio, widget: string, required: true }
      - label: 'External Links'
        name: externalLinks
        widget: list
        max: 5
        label_singular: 'external link'
        fields:
          - {
              label: 'Site name (i.e. Instagram, DeviantArt", Website)',
              name: 'name',
              widget: 'string',
            }
          - { label: 'Link / URL', name: 'url', widget: 'string' }
      - label: 'Position in page'
        name: 'position'
        widget: 'number'
        value_type: 'int'
        min: 1
        step: 1
